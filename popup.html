<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aksara</title></head>
<body><main class="popup"><p class="eyebrow">ON YOUR DEVICE</p><h1>Aksara</h1><p>Translate text in images, privately.</p><fieldset id="language-settings" disabled><legend>Languages</legend><label for="source-language">Text in image</label><select id="source-language" aria-describedby="source-help"></select><p id="source-help" class="field-help">English and Indonesian text recognition.</p><label for="target-language">Translate to</label><select id="target-language" aria-describedby="target-help"></select><p id="target-help" class="field-help">Applies to the next image you translate.</p></fieldset><p id="language-status" role="status" class="field-help">Loading language choices…</p><div class="site-choice"><label for="site-enabled"><input id="site-enabled" type="checkbox" aria-describedby="site-help site-status" disabled>Allow image controls on this site</label><p id="site-help" class="field-help">Checking the active site…</p><p id="site-status" role="status" class="field-help"></p></div><button id="enable-tab" disabled>Enable image controls</button><div class="model-summary"><p id="model-summary" role="status">Checking translation model…</p><button id="open-options" class="secondary">Translation setup & diagnostics</button></div><section id="image-permission" hidden><p id="image-host"></p><button id="allow-image-host">Allow image host</button></section><p id="popup-status" role="status">Phase 5 preview · translated image overlays</p></main><script type="module" src="/src/popup.ts"></script></body></html>
