<!doctype html>
<html lang="en" class="popup-page">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aksara</title></head>
<body>
  <main class="popup">
    <header class="popup-header">
      <div><h1>Aksara</h1><p class="subtitle">Image translation</p></div>
    </header>
    <fieldset id="language-settings" disabled>
      <legend class="sr-only">Translation languages</legend>
      <div class="language-row">
        <div><label for="source-language">From</label><select id="source-language" aria-describedby="source-help"></select></div>
        <svg class="language-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
        <div><label for="target-language">To</label><select id="target-language" aria-describedby="target-help"></select></div>
      </div>
      <p id="source-help" class="sr-only">Choose English or Indonesian text recognition.</p>
      <p id="target-help" class="sr-only">Applies to the next image you translate.</p>
    </fieldset>
    <p id="language-status" role="status" class="quiet-status">Loading language choices…</p>
    <div class="site-choice">
      <label class="site-toggle" for="site-enabled">
        <span class="site-copy"><span class="site-label">Allow on this site</span><span id="site-help" class="site-origin">Checking website…</span></span>
        <input id="site-enabled" type="checkbox" role="switch" aria-describedby="site-help site-status" disabled>
      </label>
      <p id="site-status" role="status" class="quiet-status"></p>
    </div>
    <button id="enable-tab" class="primary" aria-describedby="activation-help" disabled>Enable translation</button>
    <p id="activation-help" class="activation-help">Then hover over an image and choose Translate.</p>
    <p id="popup-status" role="status" class="activation-feedback"></p>
    <section id="image-permission" aria-label="Image access" hidden>
      <p id="image-host"></p><button id="allow-image-host">Allow image host</button>
    </section>
    <div class="model-row">
      <p id="model-summary" role="status">Checking model…</p>
      <button id="open-options" class="settings-button">Settings</button>
    </div>
    <footer><a href="privacy.html" target="_blank" rel="noopener noreferrer" aria-label="Privacy &amp; local data">Privacy</a><span>Preview · 0.8.0</span></footer>
  </main>
  <script type="module" src="/src/popup.ts"></script>
</body>
</html>
